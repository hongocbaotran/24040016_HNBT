<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giới thiệu cá nhân | Hồ Ngọc Bảo Trân</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #243047; background: #f1f8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
    main { width: min(100%, 620px); overflow: hidden; border: 1px solid #d8eafa; border-radius: 20px; background: #fff; box-shadow: 0 18px 50px rgba(38, 60, 95, .10); }
    header { padding: 34px 36px 28px; background: linear-gradient(135deg, #dceeff, #eff8ff); }
    .eyebrow { margin: 0 0 9px; color: #58799b; font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; color: #203354; font-size: clamp(1.8rem, 6vw, 2.35rem); line-height: 1.2; }
    .subtitle { margin: 10px 0 0; color: #596983; font-size: 1.05rem; }
    section { padding: 10px 36px 30px; }
    .item { padding: 18px 0; border-bottom: 1px solid #e4eff9; }
    .item:last-child { border-bottom: 0; }
    h2 { margin: 0 0 6px; color: #6483a3; font-size: .82rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    p { margin: 0; color: #293952; font-size: 1.03rem; line-height: 1.6; }
    footer { padding: 16px 36px 20px; border-top: 1px solid #e4eff9; color: #6483a3; text-align: center; font-size: .88rem; }
    @media (max-width: 480px) { header { padding: 28px 24px 24px; } section { padding: 8px 24px 22px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Giới thiệu cá nhân</p>
      <h1>Hồ Ngọc Bảo Trân</h1>
      <p class="subtitle">Quan hệ công chúng</p>
    </header>
    <section aria-label="Thông tin cá nhân">
      <div class="item">
        <h2>Kỹ năng</h2>
        <p>Tự tin</p>
      </div>
      <div class="item">
        <h2>Mục tiêu nghề nghiệp</h2>
        <p>trở thành chuyên viên Pr giỏi</p>
      </div>
    </section>
    <footer>Được tạo bằng Codex.</footer>
  </main>
</body>
</html>
